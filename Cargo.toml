[package]
name = "mlflowchart"
version = "0.1.0"
edition = "2021"
description = "Interactive ML workflow visualization tool with WebAssembly rendering"
authors = ["MLFlowChart Team"]
license = "MIT"
repository = "https://github.com/mlflowchart/mlflowchart"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "CanvasRenderingContext2d",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "HtmlElement",
  "MouseEvent",
  "Window",
]

[dependencies.wasm-bindgen]
version = "0.2"
features = ["serde-serialize"]

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]
